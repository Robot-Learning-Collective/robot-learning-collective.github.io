<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episode · BEHAVIOR-1K</title>
  <link rel="stylesheet" href="./style.css?v=20261110-bucket">
  <script src="./episode.js?v=20261110-bucket" defer></script>
</head>
<body>
  <div class="viewer">
    <aside class="instances" aria-label="Instances">
      <nav id="instance-list"></nav>
    </aside>

    <main class="main">
      <h1 id="task-name">Episode</h1>
      <p id="error" class="error" role="alert" hidden></p>
      <div class="video-box"><video id="video" controls autoplay muted playsinline preload="metadata"></video></div>
      <div class="track-stack">
        <button class="track-hint hold-hint" type="button" aria-label="Held objects track" aria-describedby="hold-hint-text">
          <img src="https://storage.googleapis.com/rlc-behavior-2026-public-exhibit/ui-icons/gripper.svg" alt="" aria-hidden="true">
          <span class="hint-tooltip" id="hold-hint-text">Objects held by the robot’s grippers, as tracked by the simulator. Colors show left, right, or both.</span>
        </button>
        <button class="track-hint goal-hint" type="button" aria-label="Goal track" aria-describedby="goal-hint-text">
          <img src="https://storage.googleapis.com/rlc-behavior-2026-public-exhibit/ui-icons/check.svg" alt="" aria-hidden="true">
          <span class="hint-tooltip" id="goal-hint-text">The track shows changes in complete BDDL goal conditions. A condition counts as satisfied only when all its subconditions hold; partial progress within it is not shown.</span>
        </button>
        <button class="track-hint stage-hint" type="button" aria-label="System 2 track" aria-describedby="stage-hint-text">
          <img src="https://storage.googleapis.com/rlc-behavior-2026-public-exhibit/ui-icons/hourglass.svg" alt="" aria-hidden="true">
          <span class="hint-tooltip" id="stage-hint-text">System 2 state: the task stage currently used by the policy.</span>
        </button>
        <div class="timeline" id="timeline" role="slider" tabindex="0" aria-label="Episode progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="hold-track" class="track hold-track" aria-label="Holding an object"></div>
          <div id="goal-track" class="track goal-track" aria-label="Goal changes"></div>
          <div id="playhead" class="playhead"></div>
        </div>
        <div class="stage-track" id="stage-track" aria-label="Stage progress">
          <svg viewBox="0 0 1000 40" preserveAspectRatio="none" aria-hidden="true"><path id="stage-line"></path></svg>
          <span id="stage-readout">stage —</span>
        </div>
      </div>
      <div class="playback">
        <span id="time">0:00 / 0:00</span>
        <div id="speeds" class="speeds" role="group" aria-label="Playback speed"></div>
      </div>
      <section class="goals" aria-labelledby="goals-title">
        <h2 id="goals-title">BDDL goals</h2>
        <ol id="goal-list"></ol>
      </section>
      <section id="reason-section" class="reason" hidden>
        <h2>Task reason</h2>
        <p id="reason"></p>
      </section>
    </main>

  </div>
</body>
</html>
